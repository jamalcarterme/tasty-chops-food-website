<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Under Maintenance</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --fg: #f0ede6;
      --accent: #e8c547;
      --muted: #3a3a3a;
      --red: #e84747;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,197,71,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,197,71,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridDrift 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridDrift {
      from { background-position: 0 0; }
      to   { background-position: 60px 60px; }
    }

    /* Vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    /* Status pill */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(232,71,71,0.12);
      border: 1px solid rgba(232,71,71,0.35);
      color: var(--red);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 2px;
      margin-bottom: 2.5rem;
      animation: fadeSlideDown 0.6s ease both;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* Headline */
    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 16vw, 13rem);
      line-height: 0.88;
      letter-spacing: 0.01em;
      color: var(--fg);
      animation: fadeSlideUp 0.7s ease 0.15s both;
    }

    .headline span {
      display: block;
      color: var(--accent);
    }

    /* Divider */
    .divider {
      width: 80px;
      height: 1px;
      background: var(--muted);
      margin: 2.5rem auto;
      animation: expandWidth 0.8s ease 0.35s both;
    }

    @keyframes expandWidth {
      from { width: 0; opacity: 0; }
      to   { width: 80px; opacity: 1; }
    }

    /* Body copy */
    .message {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      color: #888;
      line-height: 1.9;
      max-width: 420px;
      animation: fadeSlideUp 0.7s ease 0.45s both;
    }

    .message strong {
      color: var(--fg);
      font-weight: 400;
    }

    /* Try again hint */
    .try-later {
      margin-top: 2.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      animation: fadeSlideUp 0.7s ease 0.6s both;
    }

    .try-later::before,
    .try-later::after {
      content: '';
      flex: 1;
      width: 40px;
      height: 1px;
      background: rgba(232,197,71,0.3);
    }

    /* Corner decoration */
    .corner {
      position: fixed;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }
    .corner-tl { top: 1.8rem; left: 2rem; animation: fadeIn 1s ease 1s both; }
    .corner-tr { top: 1.8rem; right: 2rem; animation: fadeIn 1s ease 1s both; }
    .corner-bl { bottom: 1.8rem; left: 2rem; animation: fadeIn 1s ease 1s both; }
    .corner-br { bottom: 1.8rem; right: 2rem; animation: fadeIn 1s ease 1s both; }

    /* Keyframes */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Scanline flicker overlay */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.06) 3px,
        rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 2;
      animation: flicker 8s step-end infinite;
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96%            { opacity: 0.6; }
      97%            { opacity: 1; }
      98%            { opacity: 0.7; }
      99%            { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>

  <span class="corner corner-tl">SYS // 503</span>
  <span class="corner corner-tr">STATUS: OFFLINE</span>
  <span class="corner corner-bl">ERR_MAINTENANCE</span>
  <span class="corner corner-br" id="clock"></span>

  <div class="container">
    <div class="status-badge">
      <span class="status-dot"></span>
      Site Offline
    </div>

    <h1 class="headline">
      Down for<br/>
      <span>Maintenance</span>
    </h1>

    <div class="divider"></div>

    <p class="message">
      We're currently performing scheduled maintenance to
      <strong>improve your experience</strong>. The site will be
      back online shortly. Thank you for your patience.
    </p>

    <div class="try-later">Try again later</div>
  </div>

  <script>
    const clock = document.getElementById('clock');
    function tick() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      const s = String(now.getSeconds()).padStart(2,'0');
      clock.textContent = `${h}:${m}:${s}`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
